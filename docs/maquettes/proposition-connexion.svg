<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="titre description">
  <title id="titre">Proposition de page de connexion — Plateforme d’apprentissage</title>
  <desc id="description">Maquette statique d'une page de connexion bleu nuit, avec adresse e-mail, mot de passe, confiance sur deux jours, accès à l'inscription, activation par PIN et paramètres réseau.</desc>
  <defs>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#071120" flood-opacity="0.24"/>
    </filter>
    <style>
      .texte { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #f4f7fd; }
      .secondaire { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #aabbd1; }
      .discret { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #91a5bf; }
      .bleu { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #83bdff; }
      .icone { fill: none; stroke: #a9bad1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .icone-bleue { fill: none; stroke: #83bdff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Fond uni : une seule famille de bleus, sans dégradé multicolore. -->
  <rect width="1440" height="1040" fill="#14263d"/>
  <g transform="translate(72 58)">
    <rect width="34" height="34" rx="10" fill="#2861e8"/>
    <path d="M8 10c4-1 7 0 9 2 2-2 5-3 9-2v14c-4-1-7 0-9 2-2-2-5-3-9-2z M17 12v14" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="46" y="22" class="texte" font-size="15" font-weight="700" letter-spacing="0.2">Plateforme d'apprentissage</text>
  </g>
  <g transform="translate(1132 63)">
    <circle cx="7" cy="7" r="4" fill="#83bdff"/>
    <text x="20" y="12" class="secondaire" font-size="14">Connexion sécurisée</text>
  </g>

  <!-- Carte principale -->
  <rect x="442" y="141" width="556" height="676" rx="24" fill="#101d30" filter="url(#ombre)"/>
  <g transform="translate(486 182)">
    <rect width="102" height="29" rx="14.5" fill="#1c3457"/>
    <text x="15" y="19.5" class="bleu" font-size="12" font-weight="700" letter-spacing="0.55">BIENVENUE</text>
    <text x="0" y="78" class="texte" font-size="32" font-weight="700" letter-spacing="-0.6">Connexion</text>
    <text x="0" y="106" class="secondaire" font-size="15">Retrouvez votre espace d'apprentissage.</text>

    <!-- Accès réseau : il conserve la saisie manuelle de l'adresse et du port. -->
    <g transform="translate(420 0)">
      <rect x="0" y="0" width="48" height="48" rx="14" fill="#1b2c45"/>
      <path d="M13 20c6-5 16-5 22 0M16.5 24c4.1-3.4 10.9-3.4 15 0M20 28c2.3-1.8 5.7-1.8 8 0" class="icone-bleue"/>
      <circle cx="24" cy="32" r="1.5" fill="#83bdff"/>
    </g>

    <text x="0" y="164" class="texte" font-size="14" font-weight="600">Adresse e-mail du compte</text>
    <rect x="0" y="178" width="468" height="56" rx="13" fill="#1c2c43"/>
    <path d="M18 197h18v14H18z M18 198l9 7 9-7" class="icone"/>
    <text x="51" y="212" class="discret" font-size="16">nom@exemple.fr</text>

    <text x="0" y="274" class="texte" font-size="14" font-weight="600">Mot de passe</text>
    <rect x="0" y="288" width="468" height="56" rx="13" fill="#1c2c43"/>
    <path d="M19 311h16v13H19z M22 311v-4a5 5 0 0 1 10 0v4" class="icone"/>
    <text x="51" y="323" class="discret" font-size="19" letter-spacing="2">••••••••••••</text>
    <path d="M427 316s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z" class="icone"/>
    <circle cx="436" cy="316" r="2.5" class="icone"/>

    <rect x="0.75" y="372.75" width="18.5" height="18.5" rx="5" fill="#1c2c43" stroke="#91a5bf" stroke-width="1.5"/>
    <text x="31" y="387" class="texte" font-size="14">Faire confiance à ce poste pendant 2 jours</text>
    <text x="31" y="408" class="discret" font-size="12.5">À éviter sur un ordinateur partagé.</text>

    <rect x="0" y="438" width="468" height="56" rx="14" fill="#2861e8"/>
    <text x="234" y="473" text-anchor="middle" class="texte" font-size="17" font-weight="700">Se connecter</text>
    <path d="M306 466h16m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="0" y="546" class="secondaire" font-size="14">Pas encore de compte ?</text>
    <text x="160" y="546" class="bleu" font-size="14" font-weight="600">Créer un compte</text>
    <text x="0" y="581" class="secondaire" font-size="14">Déjà accepté ?</text>
    <text x="105" y="581" class="bleu" font-size="14" font-weight="600">Activer avec le PIN</text>
    <text x="468" y="581" text-anchor="end" class="secondaire" font-size="13">Oublier ce poste</text>
  </g>

  <!-- Aide et réseau en dehors de la carte, pour garder le formulaire léger. -->
  <g transform="translate(442 836)">
    <rect width="556" height="66" rx="16" fill="#101d30"/>
    <circle cx="29" cy="33" r="9" class="icone-bleue"/>
    <path d="M29 32v5 M29 28.5v.2" class="icone-bleue"/>
    <text x="50" y="30" class="texte" font-size="14" font-weight="600">Activation et poste de confiance</text>
    <text x="50" y="48" class="discret" font-size="12.5">Comment fonctionnent le PIN et le code de connexion ?</text>
    <path d="M518 30l5 5 5-5" class="icone"/>
  </g>
  <g transform="translate(442 934)">
    <text x="0" y="15" class="discret" font-size="12.5">Plateforme d’apprentissage  ·  Poste apprenant</text>
    <text x="556" y="15" text-anchor="end" class="secondaire" font-size="12.5">Adresse et port du serveur : paramètres réseau</text>
  </g>
</svg>
