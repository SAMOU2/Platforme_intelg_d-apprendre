<text x="287" y="690" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#374151" text-anchor="middle">⚠</text>
<text x="304" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1F2937" text-anchor="start">Brouillon local : aucune exécution automatique ni note (RG-21). Ne</text>
<text x="304" y="688.5" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1F2937" text-anchor="start">collez aucune donnée privée.</text>
<rect x="769" y="218" width="297" height="640" rx="8" fill="#F9FAFB" stroke="#1E293B" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="783" y="244" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Assistant IA (sur code)</text>
<text x="783" y="264" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" text-anchor="start">Aide NVIDIA via PC1 · ne note pas, ne</text>
<text x="783" y="279" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" text-anchor="start">valide pas.</text>
<rect x="793" y="300" width="259" height="56" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
<text x="803" y="320" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Apprenant : Pourquoi note = 12</text>
<text x="803" y="336" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">échoue ?</text>
<rect x="783" y="366" width="265" height="145" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="793" y="386" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#111827" text-anchor="start">IA : L'opérateur &gt; exclut la borne</text>
<text x="793" y="403" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#111827" text-anchor="start">12. Vérifiez l'opérateur de</text>
<text x="793" y="420" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#111827" text-anchor="start">comparaison (&gt;=) dans votre</text>
<text x="793" y="437" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#111827" text-anchor="start">condition.</text>
<text x="793" y="454" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#111827" text-anchor="start">-&gt; Section Opérateurs (Python)</text>
