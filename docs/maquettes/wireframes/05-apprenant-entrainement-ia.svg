<text x="793" y="540" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#374151" text-anchor="start">Garde-fou : refus si demande de note</text>
<text x="793" y="555" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="700" fill="#374151" text-anchor="start">ou solution complète.</text>
