<text x="268" y="178" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start">Niveau 2 — Conditions et boucles</text>
<text x="268" y="200" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#64748B" text-anchor="start">Entraînement libre avec aide IA. Votre travail ici n'est pas une copie d'examen.</text>
<rect x="268" y="218" width="485" height="110" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
<text x="282" y="242" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Énoncé de l'entraînement</text>
<text x="282" y="266" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#334155" text-anchor="start">Écrire une fonction est_admis(note) qui renvoie True si note &gt;= 12,</text>
<text x="282" y="285" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#334155" text-anchor="start">sinon False. Tester le cas limite 12.</text>
<rect x="268" y="342" width="485" height="300" rx="8" fill="#F9FAFB" stroke="#1E293B" stroke-width="1.8"/>
<text x="282" y="364" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Votre brouillon de code (non sauvegardé sur PC1) :</text>
<text x="284" y="396" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#111827" text-anchor="start">def est_admis(note):</text>
<text x="284" y="418" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#111827" text-anchor="start">if note &gt; 12:</text>
<text x="284" y="440" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#111827" text-anchor="start">return True</text>
<text x="284" y="462" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#111827" text-anchor="start">else:</text>
<text x="284" y="484" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#111827" text-anchor="start">return False</text>
<text x="284" y="506" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#111827" text-anchor="start"></text>
<text x="284" y="528" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#111827" text-anchor="start"># Question : le cas note == 12 ?</text>
<rect x="268" y="656" width="485" height="58" rx="6" fill="#F3F4F6" stroke="#374151" stroke-width="1.6" stroke-dasharray="6,4"/>
