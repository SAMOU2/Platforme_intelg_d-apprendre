<text x="1145" y="150" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Énoncé d’entraînement</text>
<text x="1145" y="168" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#374151" text-anchor="start">Rappelle explicitement que le travail ici n’est pas une</text>
<text x="1145" y="184" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#374151" text-anchor="start">copie d’examen.</text>
