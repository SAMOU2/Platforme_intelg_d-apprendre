<text x="268" y="178" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start">Niveau 2 — Conditions et boucles</text>
<text x="268" y="200" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#64748B" text-anchor="start">Cours et explications publiés par l’équipe pédagogique.</text>
<rect x="268" y="218" width="485" height="640" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
<text x="284" y="246" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">1. La structure conditionnelle if / elif / else</text>
<text x="284" y="270" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#334155" text-anchor="start">En Python, l'indentation (4 espaces) délimite le bloc exécuté</text>
<text x="284" y="290" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#334155" text-anchor="start">lorsque la condition est vraie.</text>
<rect x="284" y="333" width="453" height="145" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/>
<text x="294" y="353" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="start">Exemple de code (lecture seule) :</text>
<text x="294" y="378" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">note = 14</text>
<text x="294" y="398" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">if note &gt;= 12:</text>
<text x="294" y="418" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">print(&quot;Seuil atteint&quot;)</text>
<text x="294" y="438" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">else:</text>
<text x="294" y="458" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">print(&quot;A revoir&quot;)</text>
<text x="284" y="508" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">2. La boucle for et range()</text>
<text x="284" y="532" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#334155" text-anchor="start">La boucle for parcourt les éléments d'une séquence ou d'un</text>
<text x="284" y="552" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#334155" text-anchor="start">intervalle range(debut, fin).</text>
<rect x="284" y="600" width="453" height="110" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/>
<text x="294" y="626" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">somme = 0</text>
<text x="294" y="646" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">for k in range(1, 5):</text>
<text x="294" y="666" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12.5" fill="#111827" text-anchor="start">somme += k</text>
<text x="284" y="840" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-style="italic" fill="#64748B" text-anchor="start">[Défilement vertical si contenu plus long · Aucun code exécuté ici]</text>
