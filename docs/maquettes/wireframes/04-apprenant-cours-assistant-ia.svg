<text x="783" y="264" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" text-anchor="start">Aide NVIDIA via PC1 · ne note pas, ne</text>
<text x="783" y="279" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#475569" text-anchor="start">valide pas. Aucune donnée privée.</text>
<rect x="783" y="304" width="261" height="54" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
