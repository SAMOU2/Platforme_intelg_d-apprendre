name: Tests reinitialisation

on:
  push:
    branches: ['arena/**']
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'db/**'
      - '.github/workflows/tests-reinitialisation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'db/**'
      - '.github/workflows/tests-reinitialisation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ihm2026
          POSTGRES_USER: ihm2026
          POSTGRES_PASSWORD: test-ci-uniquement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ihm2026"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IHM_DB_URL: jdbc:postgresql://localhost:5432/ihm2026
      IHM_DB_USER: ihm2026
      IHM_DB_PASSWORD: test-ci-uniquement
      PGPASSWORD: test-ci-uniquement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Migrer la base de test jetable
        run: |
          for fichier in db/*.sql; do
            psql -h localhost -U ihm2026 -d ihm2026 -v ON_ERROR_STOP=1 -f "$fichier"
          done
      - name: Tester les envois et la recuperation en base
        run: >-
          mvn -B -ntp
          -Dtest=EnvoiReinitialisationTest,ServiceEmailTest,ServeurAuthentificationHttpsTest,GestionComptesIntegrationTest
          test
      - name: Conserver les preuves de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-reinitialisation
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
